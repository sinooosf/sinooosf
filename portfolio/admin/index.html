<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINOO Admin</title>
<style>
:root{--bg:#0a0909;--panel:#151112;--line:#32282a;--text:#f4eded;--muted:#a69a9d;--red:#d81c2f;--red2:#a91425}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:1250px;margin:auto;padding:28px}.login{min-height:100vh;display:grid;place-items:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 70px #0008}.login .card{width:min(420px,92vw)}h1,h2{margin:0}h1{font-size:28px}.sub{color:var(--muted);font-size:13px;margin-top:8px}.logo{color:var(--red);font-weight:900;letter-spacing:.16em;font-size:12px;text-transform:uppercase;margin-bottom:18px}
label{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0 0 7px}input,textarea{width:100%;background:#0e0c0d;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;outline:0}input:focus,textarea:focus{border-color:var(--red)}textarea{min-height:110px;resize:vertical}
.btn{border:1px solid var(--line);background:#171314;color:var(--text);border-radius:10px;padding:10px 14px}.btn:hover{border-color:var(--red)}.primary{background:var(--red);border-color:var(--red)}.danger{color:#ff8792}.small{font-size:12px;padding:7px 10px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.top-right{display:flex;gap:8px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab.active{background:var(--red);border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}.section{display:none}.section.active{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.list{display:grid;gap:10px;margin-top:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#110f10}.meta{min-width:0}.meta b{display:block}.meta span{display:block;color:var(--muted);font-size:12px;margin-top:4px;word-break:break-word}.row-actions{display:flex;gap:7px;flex-shrink:0}.thumb{width:72px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.project-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.message{padding:16px;border:1px solid var(--line);border-radius:12px;background:#110f10}.message.unread{border-color:#7c1a28}.msg-top{display:flex;justify-content:space-between;gap:10px}.msg-body{white-space:pre-wrap;color:#ddd;margin-top:12px;line-height:1.5;font-size:14px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;text-transform:uppercase;background:#241519;color:#ff8d98}.empty{color:var(--muted);padding:30px;text-align:center}
#toast{position:fixed;right:20px;bottom:20px;background:#f4eded;color:#111;padding:11px 14px;border-radius:10px;display:none;font-size:13px;font-weight:700}
@media(max-width:760px){.wrap{padding:16px}.grid,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start}.project-row{grid-template-columns:auto 1fr}.project-row .row-actions{grid-column:2}.row{align-items:flex-start;flex-direction:column}.row-actions{width:100%}.row-actions .btn{flex:1}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const API = 'https://sinooosf-api.onrender.com';
let token = localStorage.getItem('sinoo_admin_token') || '';
let state={status:[],skills:[],projects:[],messages:[]};
const $=s=>document.querySelector(s);
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
async function api(path,opts={}){opts.headers=opts.headers||{};if(token)opts.headers.Authorization='Bearer '+token;const r=await fetch(API+path,opts);if(r.status===401){token='';localStorage.removeItem('sinoo_admin_token');renderLogin();throw new Error('Session expired')}if(r.status===204)return null;const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
function renderLogin(){app.innerHTML=`<main class="login"><form class="card" id="loginForm"><div class="logo">SINOO SF · ADMIN</div><h1>Dashboard Login</h1><p class="sub">Private control panel for your portfolio.</p><div style="margin-top:22px"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required></div><div class="actions"><button class="btn primary" type="submit">Sign in</button></div><p id="err" style="color:#ff8792;font-size:12px"></p></form></main>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});token=d.token;localStorage.setItem('sinoo_admin_token',token);await load();renderDashboard()}catch(err){$('#err').textContent=err.message}}}
async function load(){[state.status,state.skills,state.projects,state.messages]=await Promise.all([api('/api/status'),api('/api/skills'),api('/api/projects'),api('/api/messages')])}
function renderDashboard(){app.innerHTML=`<div class="wrap">
<div class="top"><div><div class="logo">SINOO SF · ADMIN</div><h1>Portfolio Dashboard</h1><div class="sub">Manage content and incoming contact messages.</div></div><div class="top-right"><button class="btn" id="refresh">Refresh</button><button class="btn" id="logout">Logout</button></div></div>
<div class="tabs"><button class="btn tab active" data-tab="status">Status</button><button class="btn tab" data-tab="skills">Skills</button><button class="btn tab" data-tab="projects">Projects</button><button class="btn tab" data-tab="messages">Messages</button></div>
<section id="status" class="section active"></section><section id="skills" class="section"></section><section id="projects" class="section"></section><section id="messages" class="section"></section></div>`;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');renderSection(b.dataset.tab)});
$('#refresh').onclick=async()=>{await load();renderSection(document.querySelector('.tab.active').dataset.tab);toast('Refreshed')};$('#logout').onclick=()=>{token='';localStorage.removeItem('sinoo_admin_token');renderLogin()};renderSection('status')}
function renderSection(tab){if(tab==='status')renderStatus();if(tab==='skills')renderSkills();if(tab==='projects')renderProjects();if(tab==='messages')renderMessages()}
function renderStatus(){const s=$('#status');s.innerHTML=`<div class="grid"><div class="card"><h2>Add status</h2><p class="sub">The active status is shown in your portfolio header.</p><form id="statusForm" class="form-grid" style="margin-top:18px"><div><label>Label</label><input name="label" placeholder="Available for Freelance" required></div><div><label>Value</label><input name="value" placeholder="Available for Freelance"></div><div class="actions wide"><button class="btn primary">Add status</button></div></form></div><div class="card"><h2>Current statuses</h2><div class="list">${state.status.map(x=>`<div class="row"><div class="meta"><b>${esc(x.label)} ${x.active?'<span class="badge">active</span>':''}</b><span>${esc(x.value)}</span></div><div class="row-actions"><button class="btn small edit-status" data-id="${x.id}">Edit</button><button class="btn small danger del-status" data-id="${x.id}">Delete</button></div></div>`).join('')||'<div class="empty">No statuses.</div>'}</div></div></div>`;
$('#statusForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});await load();renderStatus();toast('Status added')};
document.querySelectorAll('.del-status').forEach(b=>b.onclick=async()=>{if(confirm('Delete this status?')){await api('/api/status/'+b.dataset.id,{method:'DELETE'});await load();renderStatus()}});document.querySelectorAll('.edit-status').forEach(b=>b.onclick=()=>editStatus(b.dataset.id))}
async function editStatus(id){const x=state.status.find(a=>a.id===id);const label=prompt('Label',x.label);if(label===null)return;const value=prompt('Value',x.value);if(value===null)return;const active=confirm('Set this status as active?');await api('/api/status/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,value,active})});await load();renderStatus();toast('Status updated')}
function renderSkills(){const s=$('#skills');s.innerHTML=`<div class="grid"><div class="card"><h2>Add skill</h2><form id="skillForm" style="margin-top:18px"><label>Skill name</label><input name="name" placeholder="ReactJs / Tailwind" required><div class="actions"><button class="btn primary">Add skill</button></div></form></div><div class="card"><h2>Skills</h2><div class="list">${state.skills.map(x=>`<div class="row"><div class="meta"><b>${esc(x.name)}</b></div><div class="row-actions"><button class="btn small edit-skill" data-id="${x.id}">Edit</button><button class="btn small danger del-skill" data-id="${x.id}">Delete</button></div></div>`).join('')||'<div class="empty">No skills.</div>'}</div></div></div>`;
$('#skillForm').onsubmit=async e=>{e.preventDefault();await api('/api/skills',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:new FormData(e.target).get('name')})});await load();renderSkills();toast('Skill added')};document.querySelectorAll('.del-skill').forEach(b=>b.onclick=async()=>{if(confirm('Delete this skill?')){await api('/api/skills/'+b.dataset.id,{method:'DELETE'});await load();renderSkills()}});document.querySelectorAll('.edit-skill').forEach(b=>b.onclick=async()=>{const x=state.skills.find(a=>a.id===b.dataset.id);const name=prompt('Skill name',x.name);if(name===null)return;await api('/api/skills/'+b.dataset.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});await load();renderSkills();toast('Skill updated')})}
function renderProjects(){const s=$('#projects');s.innerHTML=`<div class="grid"><div class="card"><h2>Add project</h2><form id="projectForm" class="form-grid" style="margin-top:18px"><div><label>Name</label><input name="name" required></div><div><label>Tag</label><input name="tag" placeholder="Web Development"></div><div><label>Number</label><input name="number" placeholder="07" required></div><div><label>URL</label><input name="url" type="url" placeholder="https://example.com"></div><div class="wide"><label>Image</label><input name="image" type="file" accept="image/*" required></div><div class="actions wide"><button class="btn primary">Add project</button></div></form></div><div class="card"><h2>Projects</h2><div class="list">${state.projects.map(x=>`<div class="row project-row"><img class="thumb" src="${esc(resolve(x.image))}" alt=""><div class="meta"><b>${esc(x.number)} · ${esc(x.name)}</b><span>${esc(x.tag||'')} · ${esc(x.url||'No URL')}</span></div><div class="row-actions"><button class="btn small edit-project" data-id="${x.id}">Edit</button><button class="btn small danger del-project" data-id="${x.id}">Delete</button></div></div>`).join('')||'<div class="empty">No projects.</div>'}</div></div></div>`;
$('#projectForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);await api('/api/projects',{method:'POST',body:fd});await load();renderProjects();toast('Project added')};document.querySelectorAll('.del-project').forEach(b=>b.onclick=async()=>{if(confirm('Delete this project?')){await api('/api/projects/'+b.dataset.id,{method:'DELETE'});await load();renderProjects()}});document.querySelectorAll('.edit-project').forEach(b=>b.onclick=()=>editProject(b.dataset.id))}
async function editProject(id){
const x=state.projects.find(a=>a.id===id);
const name=prompt('Project name',x.name);if(name===null)return;
const tag=prompt('Tag',x.tag||'');if(tag===null)return;
const number=prompt('Number',x.number);if(number===null)return;
const url=prompt('URL',x.url||'');if(url===null)return;
const changeImage=confirm('Change the project image?');
const fd=new FormData();fd.append('name',name);fd.append('tag',tag);fd.append('number',number);fd.append('url',url);
if(changeImage){
  const input=document.createElement('input');input.type='file';input.accept='image/*';input.style.display='none';document.body.appendChild(input);
  const selected=await new Promise(resolve=>{input.onchange=()=>resolve(input.files[0]||null);input.click()});
  input.remove();
  if(selected) fd.append('image',selected);
}
await api('/api/projects/'+id,{method:'PUT',body:fd});await load();renderProjects();toast('Project updated')}
function renderMessages(){const s=$('#messages');const unread=state.messages.filter(x=>!x.read).length;s.innerHTML=`<div class="card"><div class="top" style="margin-bottom:12px"><div><h2>Messages</h2><div class="sub">${state.messages.length} total · ${unread} unread</div></div></div><div class="list">${state.messages.map(x=>`<article class="message ${x.read?'':'unread'}"><div class="msg-top"><div><b>${esc(x.name)}</b><div class="sub">${esc(x.number)} · ${new Date(x.createdAt).toLocaleString()}</div></div><span class="badge">${esc(x.source)}</span></div><div class="msg-body">${esc(x.project)}</div><div class="actions">${!x.read?`<button class="btn small read-msg" data-id="${x.id}">Mark read</button>`:''}<button class="btn small danger del-msg" data-id="${x.id}">Delete</button></div></article>`).join('')||'<div class="empty">No messages yet.</div>'}</div></div>`;document.querySelectorAll('.read-msg').forEach(b=>b.onclick=async()=>{await api('/api/messages/'+b.dataset.id+'/read',{method:'PUT'});await load();renderMessages()});document.querySelectorAll('.del-msg').forEach(b=>b.onclick=async()=>{if(confirm('Delete this message?')){await api('/api/messages/'+b.dataset.id,{method:'DELETE'});await load();renderMessages()}})}
function resolve(x){return x.startsWith('http')?x:API+x}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
if(token){load().then(renderDashboard).catch(renderLogin)}else renderLogin()
</script>
</body></html>
