services:
  - type: web
    name: sinoo-portfolio-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/portfolio/storage
      sizeGB: 1
